services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  train:
    build: .
    volumes:
      - .:/app
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    command: python model/train.py
    profiles: ["training"]
