[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    # GCP
    "earthengine-api>=0.1.4",
    "google-cloud-storage>=2.16",
    "google-cloud-bigquery>=3.20",
    "pyarrow>=15",
    # Geospatial (GDAL installed separately in Dockerfile to match system version)
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    # Utilities
    "Pillow>=10",
    "timm>=1.0",
    "einops>=0.7",
    "gdown>=5",
    # Demo
    "streamlit>=1.35",
    # Testing
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# torch, torchvision, mmcv, mmsegmentation, open-cd are installed
# explicitly in the Dockerfile to control index URL and build order.

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
